<!doctype html>
<html lang="en" class="h-full" data-theme="nord">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amanati</title>
  <link rel="stylesheet" href="/assets/app.css">
  <script>
    // Runs before the body is parsed so a dark-mode user never sees a flash of
    // the light theme. The toggle in the title bar writes the same key back.
    (() => {
      const stored = localStorage.getItem('amanati:theme');
      const dark = stored ? stored === 'forest' : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'forest' : 'nord';
    })();
  </script>
  <script src="/assets/htmx.min.js"></script>
  <script defer src="/assets/alpine.min.js"></script>
</head>
<body class="h-full overflow-hidden bg-base-100 text-base-content antialiased">

  <div class="flex h-full flex-col">

    <!-- Title bar -->
    <header class="flex shrink-0 items-center gap-3 border-b border-base-300 bg-base-200 px-4 py-2">
      <span class="text-sm font-semibold tracking-tight">Amanati</span>
      <span class="text-xs text-base-content/70">API client</span>

      <div class="ml-auto flex items-center gap-2" x-data>
        <button type="button" @click="importFile()" class="btn btn-xs btn-outline">
          Import Postman file…
        </button>
        <button type="button" @click="importDirectory()" class="btn btn-xs btn-outline">
          Open Bruno folder…
        </button>
        <button type="button" class="btn btn-xs btn-neutral"
                hx-get="/api/blank" hx-target="#editor-pane" hx-swap="innerHTML">
          New request
        </button>

        <!-- The icons are swapped in CSS off <html data-theme>, not by
             daisyUI's swap component: swap keys off :checked, which does not
             restyle reliably here when toggled from script. -->
        <button type="button" class="btn btn-xs btn-ghost btn-square" x-data="theme"
                @click="dark = !dark; apply()"
                :aria-pressed="dark" aria-label="Toggle dark theme"
                :title="dark ? 'Switch to the light theme' : 'Switch to the dark theme'">
          <svg class="theme-icon-light size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4.5"/>
            <path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
          </svg>
          <svg class="theme-icon-dark size-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M21 13.2A9 9 0 1110.8 3a7 7 0 0010.2 10.2z"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="flex min-h-0 flex-1">

      <!-- Collections -->
      <aside class="flex w-72 shrink-0 flex-col border-r border-base-300 bg-base-200">
        <div id="sidebar" class="min-h-0 flex-1 overflow-auto"
             hx-get="/api/sidebar" hx-trigger="load, collections:changed from:body"
             hx-swap="innerHTML"></div>
      </aside>

      <!-- Request / response -->
      <main class="flex min-w-0 flex-1 flex-col">
        <section id="editor-pane" class="min-h-0 flex-[3] overflow-hidden"
                 hx-get="/api/blank" hx-trigger="load" hx-swap="innerHTML"></section>

        <section id="response-pane" class="min-h-0 flex-[2] overflow-hidden border-t border-base-300 bg-base-200/60">
          <div class="flex h-full items-center justify-center text-xs text-base-content/70">
            Send a request to see the response
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- Toast -->
  <div x-data="toast" x-show="message" x-transition class="toast toast-end" style="display: none">
    <div class="alert max-w-sm text-xs" :class="tone === 'error' ? 'alert-error' : 'alert-success'">
      <span x-text="message"></span>
    </div>
  </div>

  <script>
    // --- Wails bindings -----------------------------------------------------
    // The only things that need native code are the file dialogs; everything
    // else in the UI is HTMX talking to the Go fragment server over /api.

    function notify(message, tone) {
      window.dispatchEvent(new CustomEvent('toast', { detail: { message, tone } }));
    }

    async function runImport(binding) {
      const app = window.go && window.go.main && window.go.main.App;
      if (!app) {
        notify('Native bindings are not ready yet.', 'error');
        return;
      }
      try {
        const result = await app[binding]();
        if (result.ok) {
          htmx.trigger(document.body, 'collections:changed');
          notify('Imported ' + result.message, 'ok');
        } else if (result.message) {
          notify(result.message, 'error');
        }
      } catch (err) {
        notify(String(err), 'error');
      }
    }

    const importFile = () => runImport('ImportFile');
    const importDirectory = () => runImport('ImportDirectory');

    // --- Alpine components --------------------------------------------------

    document.addEventListener('alpine:init', () => {
      Alpine.store('ui', { active: null });

      // The head script has already picked a theme; this only mirrors it into
      // Alpine and persists whatever the user chooses afterwards.
      Alpine.data('theme', () => ({
        dark: document.documentElement.dataset.theme === 'forest',
        apply() {
          const theme = this.dark ? 'forest' : 'nord';
          document.documentElement.dataset.theme = theme;
          localStorage.setItem('amanati:theme', theme);
        },
      }));

      Alpine.data('toast', () => ({
        message: '',
        tone: 'ok',
        timer: null,
        init() {
          window.addEventListener('toast', (event) => {
            this.message = event.detail.message;
            this.tone = event.detail.tone;
            clearTimeout(this.timer);
            this.timer = setTimeout(() => { this.message = ''; }, 4000);
          });
        },
      }));
    });

    // Backs the request editor fragment. The server hands it its initial state
    // as JSON so the markup stays free of interpolated values.
    function requestEditor() {
      const node = document.getElementById('editor-data');
      const data = JSON.parse(node.dataset.state);

      return {
        ...data,
        tab: 'params',
        methods: ['GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'HEAD', 'OPTIONS'],
        tabs: [
          { id: 'params', label: 'Query' },
          { id: 'headers', label: 'Headers' },
          { id: 'body', label: 'Body' },
          { id: 'auth', label: 'Auth' },
        ],
        count(id) {
          switch (id) {
            case 'params': return this.params.filter((r) => r.enabled && r.key).length;
            case 'headers': return this.headers.filter((r) => r.enabled && r.key).length;
            case 'body': return this.body.mode === 'none' ? 0 : 1;
            case 'auth': return this.auth.type === 'none' ? 0 : 1;
            default: return 0;
          }
        },
      };
    }

    // Surface transport-level failures that never reach a template.
    document.body.addEventListener('htmx:responseError', (event) => {
      notify('Request failed: ' + event.detail.xhr.status, 'error');
    });
    document.body.addEventListener('htmx:sendError', () => {
      notify('Could not reach the local fragment server.', 'error');
    });
  </script>
</body>
</html>
